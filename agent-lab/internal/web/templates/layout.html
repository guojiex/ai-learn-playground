{{define "layout"}}<!doctype html>
<html lang="zh-cmn-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">A</span>
        <span class="brand-text">agent-lab</span>
      </div>
      <nav>
        {{range navItems .Active}}
          {{if .Disabled}}
            <span class="nav-item disabled" title="尚未启用">
              {{template "icon" .Icon}}<span>{{.Label}}</span>
              <em class="badge">soon</em>
            </span>
          {{else}}
            <a class="nav-item{{if .Active}} active{{end}}" href="{{.Path}}">
              {{template "icon" .Icon}}<span>{{.Label}}</span>
            </a>
          {{end}}
        {{end}}
      </nav>
      <div class="sidebar-foot">
        <span class="muted">M9 · trace + eval</span>
      </div>
    </aside>
    <main class="main">
      {{template "content" .}}
    </main>
  </div>
</body>
</html>
{{end}}

{{define "icon"}}
  {{$n := .}}
  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    {{if eq $n "chat"}}<path d="M21 15a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/>
    {{else if eq $n "tool"}}<path d="M14.7 6.3a4 4 0 1 1 3 3L7 21H3v-4z"/>
    {{else if eq $n "memory"}}<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
    {{else if eq $n "book-open"}}<path d="M2 4h7a2 2 0 0 1 2 2v14a1 1 0 0 0-1-1H2z"/><path d="M22 4h-7a2 2 0 0 0-2 2v14a1 1 0 0 1 1-1h8z"/>
    {{else if eq $n "plan"}}<path d="M3 6h18M3 12h12M3 18h6"/>
    {{else if eq $n "multi"}}<circle cx="9" cy="7" r="3"/><circle cx="17" cy="11" r="3"/><circle cx="7" cy="17" r="3"/><path d="M9 7h8M9 17l8-6"/>
    {{else if eq $n "approve"}}<path d="M20 6 9 17l-5-5"/>
    {{else if eq $n "trace"}}<path d="M3 12h4l3-8 4 16 3-8h4"/>
    {{else if eq $n "route"}}<path d="M4 6h12l4 4-4 4H4z"/><path d="M4 14h8"/>
    {{else if eq $n "gear"}}<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.13-1.32l2.05-1.57-2-3.46-2.45.78a7 7 0 0 0-2.27-1.31l-.34-2.6h-4l-.34 2.6a7 7 0 0 0-2.27 1.31l-2.45-.78-2 3.46 2.05 1.57A7 7 0 0 0 5 12a7 7 0 0 0 .13 1.32L3.08 14.9l2 3.46 2.45-.78a7 7 0 0 0 2.27 1.31l.34 2.6h4l.34-2.6a7 7 0 0 0 2.27-1.31l2.45.78 2-3.46-2.05-1.57A7 7 0 0 0 19 12z"/>
    {{else if eq $n "book"}}<path d="M4 4h10a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M4 16a4 4 0 0 1 4-4h10"/>
    {{else}}<circle cx="12" cy="12" r="9"/>{{end}}
  </svg>
{{end}}
